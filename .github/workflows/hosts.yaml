name: Build Nix Hosts

on:
  push:
    branches: ["master"]
    paths:
      - "hosts/**"
      - "users/**"
      - "flake.nix"
      - "flake.lock"
  pull_request:
    paths:
      - "hosts/**"
      - "users/**"
      - "flake.nix"
      - "flake.lock"

jobs:
  discover-hosts:
    name: Discover Hosts
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.get-hosts.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            accept-flake-config = true
            extra-experimental-features = nix-command flakes pipe-operators
      - name: Get hosts from flake
        id: get-hosts
        run: |
          set -euo pipefail

          ALL_HOSTS=$(nix eval --json --system x86_64-linux ".#nixosConfigurations" --apply builtins.attrNames | jq -r '.[]')
          echo "All hosts from flake: $ALL_HOSTS"
          {
            echo 'matrix<<EOF'
            echo "$ALL_HOSTS"
            echo EOF
          } >> "$GITHUB_OUTPUT"

  build-hosts:
    runs-on: ubuntu-latest
    needs: discover-hosts
    strategy:
      fail-fast: false
      matrix:
        host: ${{ fromJson(needs.discover-hosts.outputs.matrix) }}
    name: Build Host ${{ matrix.host }}
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            accept-flake-config = true
            extra-experimental-features = nix-command flakes pipe-operators

      - name: Build Host
        run: nix build .#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel --no-link --print-out-paths
